name: Build LockScreenGradientClock

on:
  workflow_dispatch:
  push:
    branches: [ main, master, 'fix/wake-flash-safe-2.0.8', 'feature/hide-native-clock-switch', 'feature/charging-eta-pill', 'feature/charging-eta-pill-ios17-compat' ]

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install make dpkg ldid xz

      - name: Install RootHide Theos
        run: |
          set -e
          rm -rf "$HOME/theos"
          git clone --recursive https://github.com/roothide/theos.git "$HOME/theos"

      - name: Set Theos environment
        run: |
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          echo "THEOS_MAKE_PATH=$HOME/theos/makefiles" >> "$GITHUB_ENV"
          echo "$HOME/theos/bin" >> "$GITHUB_PATH"

      - name: Install iPhoneOS 16.5 SDK
        run: |
          set -e
          rm -rf /tmp/theos-sdks
          mkdir -p "$HOME/theos/sdks"
          git clone --depth=1 --filter=blob:none --sparse \
            https://github.com/theos/sdks.git /tmp/theos-sdks
          cd /tmp/theos-sdks
          git sparse-checkout set iPhoneOS16.5.sdk
          cp -R iPhoneOS16.5.sdk "$HOME/theos/sdks/"

      - name: Verify build environment
        run: |
          set -e
          test -f "$THEOS/makefiles/common.mk"
          test -f "$THEOS/makefiles/tweak.mk"
          test -f "$THEOS/makefiles/aggregate.mk"
          test -d "$THEOS/sdks/iPhoneOS16.5.sdk"
          echo "THEOS=$THEOS"
          xcrun --version

      - name: Run wake safety regression
        run: |
          set -e
          c++ -std=c++17 -Wall -Wextra -Werror tests/wake_strategy_test.cpp -o /tmp/wake_strategy_test
          /tmp/wake_strategy_test
          python3 scripts/verify_wake_strategy.py

      - name: Run math tests
        run: |
          set -e
          c++ -std=c++17 -Wall -Wextra -Werror tests/gradient_math_test.cpp -o /tmp/gradient_math_test
          /tmp/gradient_math_test
          c++ -std=c++17 -Wall -Wextra -Werror tests/edge_math_test.cpp -o /tmp/edge_math_test
          /tmp/edge_math_test
          c++ -std=c++17 -Wall -Wextra -Werror tests/palette_test.cpp -o /tmp/palette_test
          /tmp/palette_test
          c++ -std=c++17 -Wall -Wextra -Werror tests/clock_safety_test.cpp -o /tmp/clock_safety_test
          /tmp/clock_safety_test
          python3 scripts/verify_clock_safety.py
          c++ -std=c++17 -Wall -Wextra -Werror tests/clock_host_order_test.cpp -o /tmp/clock_host_order_test
          /tmp/clock_host_order_test
          python3 scripts/verify_clock_host_order.py
          c++ -std=c++17 -Wall -Wextra -Werror tests/clock_scope_test.cpp -o /tmp/clock_scope_test
          /tmp/clock_scope_test
          python3 scripts/verify_clock_startup.py
          python3 scripts/verify_clock_diagnostics.py
          c++ -std=c++17 -Wall -Wextra -Werror tests/clock_render_test.cpp -o /tmp/clock_render_test
          /tmp/clock_render_test
          python3 scripts/verify_clock_render.py
          python3 scripts/verify_shared_palette_date.py
          python3 scripts/verify_date_no_edges.py
          c++ -std=c++17 -Wall -Wextra -Werror tests/edge_coordinates_test.cpp -framework CoreGraphics -framework CoreFoundation -o /tmp/edge_coordinates_test
          /tmp/edge_coordinates_test

      - name: Verify settings schema and clock geometry isolation
        run: python3 scripts/verify_settings.py

      - name: Verify package metadata
        run: |
          set -e
          grep -E '^(Package|Name|Version|Depends):' control

      - name: Build Rootless
        run: |
          set -e
          make clean || true
          rm -rf packages
          THEOS_PACKAGE_SCHEME=rootless make package FINALPACKAGE=1
          mkdir -p build
          deb=$(find packages -maxdepth 1 -type f -name '*.deb' | head -n 1)
          test -n "$deb"
          cp "$deb" build/LockScreenGradientClock-rootless.deb

      - name: Build Roothide
        run: |
          set -e
          make clean || true
          rm -rf packages
          THEOS_PACKAGE_SCHEME=roothide make package FINALPACKAGE=1
          deb=$(find packages -maxdepth 1 -type f -name '*.deb' | head -n 1)
          test -n "$deb"
          cp "$deb" build/LockScreenGradientClock-roothide.deb

      - name: Verify packages
        run: |
          set -e
          ls -lh build/*.deb
          for deb in build/*.deb; do
            echo "===== $deb ====="
            dpkg-deb --info "$deb"
            dpkg-deb --contents "$deb" | grep -E \
              'LockScreenGradientClock|PreferenceBundles|PreferenceLoader' || true
          done
          python3 scripts/verify_packages.py build/*.deb

      - name: Upload DEB packages
        uses: actions/upload-artifact@v4
        with:
          name: LockScreenGradientClock
          path: build/*.deb
          if-no-files-found: error
