name: Build tweak
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    strategy:
      matrix:
        scheme: [rootless, roothide]
    steps:
      - uses: actions/checkout@v4
      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $THEOS
          brew install ldid
      - name: Build
        run: make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=${{ matrix.scheme }}
      - uses: actions/upload-artifact@v4
        with:
          name: LockScreenGradientClock-${{ matrix.scheme }}
          path: packages/*.deb
